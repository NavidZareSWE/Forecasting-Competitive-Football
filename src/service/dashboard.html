<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>In-play replay dashboard</title>
<style>
  :root {
    --bg: #101418; --panel: #1a2026; --ink: #e8edf2; --dim: #8a97a3;
    --home: #4fc3f7; --draw: #b0bec5; --away: #ef9a9a; --accent: #ffd54f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
           padding: 14px 18px; background: var(--panel); }
  h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; }
  select, button { background: #232b33; color: var(--ink); border: 1px solid #37424c;
           border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  main { display: grid; grid-template-columns: 2.2fr 1fr; gap: 14px;
         padding: 14px 18px; max-width: 1180px; }
  .card { background: var(--panel); border-radius: 10px; padding: 12px 14px; }
  .card h2 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
             color: var(--dim); margin: 0 0 8px; }
  #scoreline { font-size: 26px; font-weight: 700; }
  #clock { color: var(--accent); font-variant-numeric: tabular-nums; }
  .legend span { margin-right: 14px; font-size: 12px; color: var(--dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
              margin-right: 5px; }
  svg text { fill: var(--dim); font-size: 10px; }
  .shap-row { display: grid; grid-template-columns: 1fr 70px; gap: 8px;
              align-items: center; margin: 5px 0; font-size: 12px; }
  .shap-bar { height: 10px; border-radius: 3px; }
  .muted { color: var(--dim); font-size: 12px; }
  #events div { font-size: 12px; margin: 3px 0; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>In-play replay &mdash; held-out match</h1>
  <select id="match"></select>
  <button id="play">&#9654; Replay</button>
  <button id="pause" disabled>&#10074;&#10074;</button>
  <span class="muted">1 snapshot / <span id="pace">1.2</span>s &middot;
    minute <span id="clock">&ndash;</span></span>
</header>
<main>
  <section class="card" style="grid-column: 1;">
    <h2>Outcome probabilities over match time</h2>
    <div class="legend">
      <span><i style="background:var(--home)"></i>Home win</span>
      <span><i style="background:var(--draw)"></i>Draw</span>
      <span><i style="background:var(--away)"></i>Away win</span>
      <span><i style="background:var(--accent)"></i>&#9679; goal &nbsp;
            &#9632; card</span>
    </div>
    <svg id="probchart" viewBox="0 0 720 260" width="100%"></svg>
    <h2 style="margin-top:10px">Expected final margin (home &minus; away)</h2>
    <svg id="marginchart" viewBox="0 0 720 120" width="100%"></svg>
  </section>
  <section style="display:flex; flex-direction:column; gap:14px;">
    <div class="card">
      <h2>Current state</h2>
      <div id="scoreline">&ndash;</div>
      <div class="muted" id="models"></div>
      <div class="muted" id="advantage"></div>
    </div>
    <div class="card">
      <h2>Top SHAP attributions (P(home win), this snapshot)</h2>
      <div id="shap" class="muted">press replay</div>
    </div>
    <div class="card">
      <h2>Key events</h2>
      <div id="events" class="muted">&ndash;</div>
    </div>
  </section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const PACE_MS = 1200;
let series = [], events = [], timer = null, cursor = 0, minutes = [];

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(path + " -> " + r.status);
  return r.json();
}

async function loadMatches() {
  const list = await api("/matches");
  $("match").innerHTML = list.map(m =>
    `<option value="${m.match_id}">${m.match_id} &middot; ${m.competition} ` +
    `&middot; ${m.date.slice(0, 10)}</option>`).join("");
}

function detectEvents(snaps) {
  const found = [];
  for (let i = 1; i < snaps.length; i++) {
    const prev = snaps[i - 1], cur = snaps[i];
    if (cur.score.home > prev.score.home)
      found.push({minute: cur.minute, kind: "goal", side: "home"});
    if (cur.score.away > prev.score.away)
      found.push({minute: cur.minute, kind: "goal", side: "away"});
    if (cur.man_advantage !== prev.man_advantage)
      found.push({minute: cur.minute, kind: "card",
                  side: cur.man_advantage > prev.man_advantage ? "away" : "home"});
  }
  return found;
}

const X = m => 40 + (m / 90) * 660;

function drawProb(upto) {
  const svg = $("probchart");
  const Y = p => 240 - p * 220;
  const colors = {H: "var(--home)", D: "var(--draw)", A: "var(--away)"};
  let out = "";
  for (const g of [0, 0.25, 0.5, 0.75, 1])
    out += `<line x1="40" x2="700" y1="${Y(g)}" y2="${Y(g)}" stroke="#2a333c"/>` +
           `<text x="8" y="${Y(g) + 3}">${g.toFixed(2)}</text>`;
  for (const m of [0, 15, 30, 45, 60, 75, 90])
    out += `<text x="${X(m) - 6}" y="256">${m}'</text>`;
  for (const key of ["H", "D", "A"]) {
    const pts = series.slice(0, upto + 1)
      .map(s => `${X(s.minute)},${Y(s.probabilities[key])}`).join(" ");
    out += `<polyline points="${pts}" fill="none" stroke="${colors[key]}" stroke-width="2"/>`;
  }
  for (const e of events.filter(e => e.minute <= series[upto].minute)) {
    const glyph = e.kind === "goal"
      ? `<circle cx="${X(e.minute)}" cy="14" r="5" fill="var(--accent)"/>`
      : `<rect x="${X(e.minute) - 4}" y="24" width="8" height="8" fill="var(--accent)"/>`;
    out += glyph;
  }
  svg.innerHTML = out;
}

function drawMargin(upto) {
  const svg = $("marginchart");
  const Y = v => 60 - (v / 3) * 45;
  let out = `<line x1="40" x2="700" y1="${Y(0)}" y2="${Y(0)}" stroke="#2a333c"/>`;
  for (const v of [-3, 0, 3])
    out += `<text x="8" y="${Y(v) + 3}">${v > 0 ? "+" + v : v}</text>`;
  const pts = series.slice(0, upto + 1)
    .map(s => `${X(s.minute)},${Y(Math.max(-3, Math.min(3, s.expected_margin)))}`)
    .join(" ");
  out += `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  svg.innerHTML = out;
}

function drawShap(snap) {
  if (!snap.top_shap) { $("shap").textContent = "pre-match snapshot"; return; }
  const most = Math.max(...snap.top_shap.map(f => Math.abs(f.shap)), 1e-9);
  $("shap").innerHTML = snap.top_shap.map(f => {
    const width = Math.abs(f.shap) / most * 100;
    const color = f.shap >= 0 ? "var(--home)" : "var(--away)";
    return `<div class="shap-row"><div>` +
      `<div>${f.feature} = ${f.value}</div>` +
      `<div class="shap-bar" style="width:${width}%;background:${color}"></div>` +
      `</div><div style="text-align:right">${f.shap >= 0 ? "+" : ""}${f.shap.toFixed(3)}</div></div>`;
  }).join("");
}

function render(index) {
  const snap = series[index];
  $("clock").textContent = snap.minute === null ? "pre" : snap.minute + "'";
  $("scoreline").textContent = `${snap.score.home} – ${snap.score.away}`;
  $("models").textContent =
    `outcome: ${snap.models.outcome} · margin: ${snap.models.margin}`;
  $("advantage").textContent = snap.man_advantage
    ? `man advantage: ${snap.man_advantage > 0 ? "home" : "away"} ` +
      `+${Math.abs(snap.man_advantage)}` : "";
  drawProb(index); drawMargin(index); drawShap(snap);
  $("events").innerHTML = events.filter(e => e.minute <= snap.minute).map(e =>
    `<div>${e.minute}' — ${e.kind === "goal" ? "⚽ goal" : "🟥 card"} (${e.side})</div>`
  ).join("") || "&ndash;";
}

async function play() {
  $("play").disabled = true; $("pause").disabled = false;
  const matchId = $("match").value;
  // The page polls the prediction endpoint snapshot by snapshot, replaying
  // the held-out match as if it were live.
  const pre = await api(`/predict?match_id=${matchId}`);
  minutes = (await api(`/replay/${matchId}`)).snapshots.map(s => s.minute);
  series = [Object.assign({}, pre, {minute: 0})];
  cursor = 0;
  const step = async () => {
    if (cursor >= minutes.length) { pause(); return; }
    const snap = await api(
      `/predict?match_id=${matchId}&minute=${minutes[cursor]}`);
    series[cursor] = snap;          // replace pre-match placeholder at 0'
    events = detectEvents(series);
    render(cursor);
    cursor += 1;
  };
  await step();
  timer = setInterval(step, PACE_MS);
}

function pause() {
  clearInterval(timer); timer = null;
  $("play").disabled = false; $("pause").disabled = true;
}

$("play").addEventListener("click", play);
$("pause").addEventListener("click", pause);
loadMatches();
</script>
</body>
</html>
